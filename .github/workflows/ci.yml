name: CI

# Unit tests (api/*.test.ts) and integration tests (api/integration/*.int.ts,
# against the local Supabase CLI stack). Runs on pull requests, and before
# every deploy: continous-deployment.yml calls it and deploys only if it passes.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api/ imports @meerkat-events/react from its dist/.
      - run: pnpm --dir packages/react build
      - run: pnpm --dir api test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/react build
      - run: pnpm --dir api test:integration
