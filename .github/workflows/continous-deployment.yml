# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
name: Continuous Deployment
on:
  push:
    branches:
      - master
  release:
    types:
      - created

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
  set-env:
    name: Set Environment Variable
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.set-env.outputs.ENVIRONMENT }}
    steps:
      - name: Determine Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            ENVIRONMENT=prod
          elif [ "${{ github.event_name }}" == "push" ]; then
            ENVIRONMENT=dev
          fi
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: [ci, set-env]
    concurrency: deploy-group # optional: ensure only one action runs at a time
    environment: ${{ needs.set-env.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v5
      - name: Print Environment Variable
        run: |
          echo "Deploying to environment: ${{ needs.set-env.outputs.deploy_env }}"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: envsubst < fly.template.toml > fly.toml
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          LEGAL_OPERATOR: ${{ secrets.LEGAL_OPERATOR }}
          APP_NAME: ${{ secrets.APP_NAME }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PRIMARY_REGION: ${{ secrets.PRIMARY_REGION }}
          DATABASE_MAX_POOL_SIZE: ${{ secrets.DATABASE_MAX_POOL_SIZE }}
          CPUS: ${{ vars.CPUS }}
          CPU_KIND: ${{ vars.CPU_KIND }}
          MEMORY: ${{ vars.MEMORY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEVCON_VERIFICATION_SECRET: ${{ secrets.DEVCON_VERIFICATION_SECRET }}
          PRETALX_URL: ${{ secrets.PRETALX_URL }}
          ENVIRONMENT: ${{ needs.set-env.outputs.deploy_env }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          RELEASE_VERSION: ${{ github.sha }}
      # The PostHog key uploads the browser source maps during the image
      # build (Dockerfile); as a build secret it stays out of the image.
      - run: flyctl deploy --remote-only --build-secret "POSTHOG_CLI_API_KEY=$POSTHOG_CLI_API_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
