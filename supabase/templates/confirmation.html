<h2>Confirm your Meerkat QA signup</h2>

<p style="font:32px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;margin:16px 0">
  {{ .Token }}
</p>
<p>Or confirm on this device:</p>
<p style="margin:16px 0">
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-weight:600">Confirm and sign in</a>
