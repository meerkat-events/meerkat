<div style="display:none;max-height:0;overflow:hidden">Your Meerkat QA code is {{ .Token }}.</div>

<h2>Sign in to Meerkat QA</h2>
<p>Enter this one-time code in Meerkat QA:</p>
<p style="font:32px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;margin:16px 0">
  {{ .Token }}
</p>
<p>Or sign in on this device:</p>
<p style="margin:16px 0">
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-weight:600">Sign in to Meerkat QA</a>
</p>
<p>The code and the link work once, whichever you use first.</p>
<p>If this wasn’t you on Meerkat QA, ignore this email.</p>
