# fly.toml app configuration file generated on 2024-08-03T22:14:02+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '$APP_NAME'
primary_region = '$PRIMARY_REGION'

# Build time only (Dockerfile), and public: VITE_API_URL and LEGAL_OPERATOR
# are compiled into the browser bundle; POSTHOG_CLI_HOST, POSTHOG_CLI_PROJECT_ID
# and RELEASE_VERSION tag its source-map upload, whose API key is a build
# secret (`--build-secret` in the deploy workflow), never a build arg. The
# rendered fly.toml is readable like [env], so nothing confidential goes here.
# The running app reads none of these, so they stay out of [env].
[build.args]
VITE_API_URL = '$VITE_API_URL'
LEGAL_OPERATOR = '$LEGAL_OPERATOR'
POSTHOG_CLI_HOST = '$POSTHOG_CLI_HOST'
POSTHOG_CLI_PROJECT_ID = '$POSTHOG_CLI_PROJECT_ID'
RELEASE_VERSION = '$RELEASE_VERSION'

# Plain settings only: [env] is readable by anyone with access to the app
# (`fly config show`). Credentials (DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SUPABASE_SECRET_KEY, DEVCON_VERIFICATION_SECRET, OPENROUTER_API_KEY) and the
# Supabase project's SUPABASE_URL and SUPABASE_ANON_KEY are Fly secrets
# (`fly secrets set`), which also win over [env] on a name clash.
[env]
PORT = '8000'
BASE_URL = '$BASE_URL'
DATABASE_MAX_POOL_SIZE = '$DATABASE_MAX_POOL_SIZE'
PRETALX_URL = '$PRETALX_URL'
ENVIRONMENT = '$ENVIRONMENT'
POSTHOG_PROJECT_TOKEN = '$POSTHOG_PROJECT_TOKEN'
POSTHOG_HOST = '$POSTHOG_HOST'

[deploy]
# Runs once per deploy in a temporary machine before the rollout; a failure
# aborts the deploy and the running version keeps serving.
release_command = 'node /workspace/api/migrate.ts'

[processes]
app = 'node --import /workspace/api/instrumentation.ts /workspace/api/main.ts'

[http_service]
internal_port = 8000
force_https = true
# Never stop machines on their own: stopping one drops every SSE stream it
# holds (a few thousand at event scale) and they all reconnect at once. The
# machine count is set with `fly scale count`; deploys keep it. With
# auto_stop off, Fly doesn't act on min_machines_running: it only records
# the intended prod count (2, so one can fail).
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 2
processes = ['app']

# Every open page (Q&A on phones, stage screens, organizer pages) holds an SSE
# stream for as long as it is open, and each one counts as a request in
# flight. Fly's default (connections, soft_limit 20) would call a machine busy
# after a few dozen viewers. Above soft_limit the proxy prefers other machines;
# at hard_limit it queues new requests.
#
# Prod runs 2 machines (shared-cpu-2x; size from the GitHub `prod`
# variables CPUS, CPU_KIND, MEMORY): Devcon 8's peak was about 300 open
# pages. At soft_limit they hold 5,000 streams, and one machine alone up to
# hard_limit's 4,000. For a bigger audience, add machines with
# `fly scale count`; every update makes each open page refetch the
# questions, so CPU and database run out long before these limits.
[http_service.concurrency]
type = 'requests'
soft_limit = 2500
hard_limit = 4000

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/v1/health"

[[vm]]
cpus = $CPUS
cpu_kind = "$CPU_KIND"
memory = "$MEMORY"
