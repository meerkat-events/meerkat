# fly.toml app configuration file generated on 2024-08-03T22:14:02+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '$APP_NAME'
primary_region = '$PRIMARY_REGION'

[build.args]
VITE_API_URL = '$VITE_API_URL'

[env]
PORT = '8000'
BASE_URL = '$BASE_URL'
SENTRY_DSN = '$SENTRY_DSN'
DATABASE_MAX_POOL_SIZE = '$DATABASE_MAX_POOL_SIZE'
ENVIRONMENT = '$ENVIRONMENT'
VITE_API_URL = '$VITE_API_URL'
SUPABASE_SERVICE_ROLE_KEY = '$SUPABASE_SERVICE_ROLE_KEY'
SUPABASE_SECRET_KEY = '$SUPABASE_SECRET_KEY'
DEVCON_VERIFICATION_SECRET = '$DEVCON_VERIFICATION_SECRET'
PRETALX_URL = '$PRETALX_URL'

[deploy]
# Runs once per deploy in a temporary machine before the rollout; a failure
# aborts the deploy and the running version keeps serving.
release_command = 'node /workspace/api/migrate.ts'
# One new Machine first: it must pass the machine check and health check below
# before the others are replaced. Not bluegreen: flyctl skips machine checks
# there.
strategy = 'canary'

[processes]
app = 'node /workspace/api/main.ts'

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 4
processes = ['app']

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/v1/health"

# Runs api/scripts/smoke-test.ts in a throwaway Machine (same image) against
# each new Machine before it gets traffic; a failure stops the deploy.
[[http_service.machine_checks]]
command = ["node", "/workspace/api/scripts/smoke-test.ts"]
kill_timeout = "60s"

[[vm]]
cpus = $CPUS
cpu_kind = "$CPU_KIND"
memory = "$MEMORY"

[[statics]]
guest_path = "/workspace/api/build/client/assets"
url_prefix = "/assets"
