# fly.toml app configuration file generated on 2024-08-03T22:14:02+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '$APP_NAME'
primary_region = '$PRIMARY_REGION'

[build.args]
VITE_API_URL = '$VITE_API_URL'
POSTHOG_CLI_HOST = '$POSTHOG_CLI_HOST'
POSTHOG_CLI_PROJECT_ID = '$POSTHOG_CLI_PROJECT_ID'
RELEASE_VERSION = '$RELEASE_VERSION'

[env]
PORT = '8000'
BASE_URL = '$BASE_URL'
DATABASE_MAX_POOL_SIZE = '$DATABASE_MAX_POOL_SIZE'
VITE_API_URL = '$VITE_API_URL'
SUPABASE_SERVICE_ROLE_KEY = '$SUPABASE_SERVICE_ROLE_KEY'
SUPABASE_SECRET_KEY = '$SUPABASE_SECRET_KEY'
DEVCON_VERIFICATION_SECRET = '$DEVCON_VERIFICATION_SECRET'
PRETALX_URL = '$PRETALX_URL'
ENVIRONMENT = '$ENVIRONMENT'
POSTHOG_PROJECT_TOKEN = '$POSTHOG_PROJECT_TOKEN'
POSTHOG_HOST = '$POSTHOG_HOST'

[deploy]
# Runs once per deploy in a temporary machine before the rollout; a failure
# aborts the deploy and the running version keeps serving.
release_command = 'node /workspace/api/migrate.ts'

[processes]
app = 'node --import /workspace/api/instrumentation.ts /workspace/api/main.ts'

[http_service]
internal_port = 8000
force_https = true
# Never stop machines on their own: stopping one drops every SSE stream it
# holds (a few thousand at event scale) and they all reconnect at once. The
# machine count is set with `fly scale count`; deploys keep it.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 6
processes = ['app']

# Every open page (Q&A on phones, stage screens, organizer pages) holds an SSE
# stream for as long as it is open, and each one counts as a request in
# flight. Fly's default (connections, soft_limit 20) would call a machine busy
# after a few dozen viewers. Above soft_limit the proxy prefers other machines;
# at hard_limit it queues new requests.
#
# Sized for 15,000 open pages on 6 machines (performance-2x, 4 GB): 2,500
# streams each at soft_limit, and with one machine down 15,000 / 5 = 3,000,
# still under hard_limit.
[http_service.concurrency]
type = 'requests'
soft_limit = 2500
hard_limit = 4000

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/v1/health"

[[vm]]
cpus = $CPUS
cpu_kind = "$CPU_KIND"
memory = "$MEMORY"

[[statics]]
guest_path = "/workspace/api/build/client/assets"
url_prefix = "/assets"
